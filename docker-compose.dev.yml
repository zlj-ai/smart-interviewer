services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smart-interviewer-postgres
    environment:
      POSTGRES_DB: smart_interviewer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_interviewer"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: smart-interviewer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    container_name: smart-interviewer-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc
    container_name: smart-interviewer-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/resumes 2>/dev/null || true;
      exit 0"

  # 可观测栈：镜像走国内源（grafana/otel-lgtm 的 ghcr.io 拉取被拒，拆组件部署）
  prometheus:
    image: docker.m.daocloud.io/prom/prometheus:latest
    container_name: smart-interviewer-prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  tempo:
    image: docker.m.daocloud.io/grafana/tempo:latest
    container_name: smart-interviewer-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./docker/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "4318:4318"
      - "3200:3200"

  grafana:
    image: docker.m.daocloud.io/grafana/grafana:latest
    container_name: smart-interviewer-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo

  # ===== 全栈部署（--profile full 启用）：应用与前端也容器化 =====
  # 默认开发模式只起基础设施，应用用 bootRun 跑宿主机
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: smart-interviewer-app
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen-plus}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-v3}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: resumes
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-interviewer-frontend
    ports:
      - "5173:80"
    depends_on:
      - app

volumes:
  postgres-data:
  redis-data:
  minio-data:
