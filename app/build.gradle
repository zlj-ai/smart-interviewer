/*
 * Smart Interviewer - Backend Application
 * Spring Boot 4.1 + Java 25 + Spring AI 2.0 + PostgreSQL + pgvector + Redis
 */

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.smartinterview'
version = '0.1.0-SNAPSHOT'

repositories {
    maven { url = uri('https://maven.aliyun.com/repository/public/') }
    maven { url = uri('https://maven.aliyun.com/repository/spring/') }
    maven { url = uri('https://maven.aliyun.com/repository/gradle-plugin/') }
    maven { url = uri('https://maven.aliyun.com/repository/spring-plugin/') }
    mavenCentral()
    maven { url = uri('https://repo.spring.io/milestone') }
}

dependencies {
    // Spring Boot Starters (Boot 4 modular design)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JWT 签发与解析
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // H2 Database for testing
    testRuntimeOnly 'com.h2database:h2'

    // Spring AI 2.0 - OpenAI 兼容模式接入
    implementation 'org.springframework.ai:spring-ai-starter-model-openai:2.0.0'
    // Spring AI 2.0 - pgvector 向量存储（RAG 知识库）
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector:2.0.0'

    // Apache Tika - 文档解析（知识库上传）
    implementation 'org.apache.tika:tika-core:2.9.2'
    implementation 'org.apache.tika:tika-parsers-standard-package:2.9.2'

    // AWS S3 SDK - 对象存储（RustFS/MinIO 兼容协议，简历文件存取）
    implementation "software.amazon.awssdk:s3:2.29.51"

    // Redisson - Redis 客户端（缓存 / 分布式锁 / Stream）
    implementation 'org.redisson:redisson-spring-boot-starter:4.0.0'

    // SpringDoc OpenAPI - Swagger 接口文档
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'

    // Prometheus metrics endpoint for Actuator
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // 分布式追踪：Micrometer OTel bridge + OTLP 导出（Grafana Tempo）
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    runtimeOnly 'io.opentelemetry:opentelemetry-exporter-otlp'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    // MapStruct - 对象映射 (必须在Lombok之后配置)
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.micrometer:micrometer-registry-prometheus'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// 全局UTF-8编码配置
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'rag-eval'
    }
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// RAG 评估任务：仅 rag-eval 标签，需 RUN_RAG_EVAL=true 与有效 LLM key（付费调用防误触）
// 运行方式：RUN_RAG_EVAL=true ./gradlew :app:ragEvaluation --no-daemon
tasks.register('ragEvaluation', Test) {
    description = 'RAG 评估基线（检索命中率 / 引用率 / 耗时，需真实 LLM）'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'rag-eval'
    }
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    systemProperty 'ragEval.reportDir', layout.buildDirectory.dir('reports/rag-eval').get().asFile.absolutePath
    outputs.upToDateWhen { false }
    def envFile = rootProject.file('.env')
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def trimmed = line.trim()
            if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
                def (key, value) = trimmed.split('=', 2)
                if (System.getenv(key) == null) { environment key, value }
            }
        }
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// 将仓库根目录 .env 注入 bootRun，便于本地加载 AI_API_KEY 等变量（Gradle 进程默认不读 .env）
tasks.named('bootRun') {
    // JVM 编码配置（JDK 18+，避免控制台 PrintStream 与 Logback UTF-8 不一致）
    jvmArgs = [
            '-Dfile.encoding=UTF-8',
            '-Dconsole.encoding=UTF-8',
            '-Dstdout.encoding=UTF-8',
            '-Dstderr.encoding=UTF-8',
            '--enable-native-access=ALL-UNNAMED'
    ]

    def envFile = rootProject.file('.env')
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def trimmed = line.trim()
            if (trimmed.isEmpty() || trimmed.startsWith('#')) {
                return
            }
            def eq = trimmed.indexOf('=')
            if (eq <= 0) {
                return
            }
            def key = trimmed.substring(0, eq).trim()
            def val = trimmed.substring(eq + 1).trim()
            if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
                val = val.substring(1, val.length() - 1)
            }
            environment key, val
        }
    }
}
