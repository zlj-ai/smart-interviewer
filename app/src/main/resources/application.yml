server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: smart-interviewer
  threads:
    virtual:
      enabled: true
  autoconfigure:
    # 向量存储使用 AiModelConfig 中的手动装配（显式维度/距离类型），排除自动配置避免 bean 冲突
    exclude: org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:smart_interviewer}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  ai:
    # 保留该属性避免 OpenAI 自动配置在无 key 环境启动失败；业务实际走 app.ai 多 Provider 注册
    openai:
      api-key: ${AI_API_KEY:no-key}

app:
  jwt:
    # 生产环境必须通过环境变量覆盖；本地默认值仅用于开发启动
    secret: ${JWT_SECRET:dev-only-jwt-secret-0123456789abcdef-change-me-in-env}
    access-ttl: 2h
    refresh-ttl: 168h

  ai:
    default-provider: ${AI_DEFAULT_PROVIDER:dashscope}
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-v3}
    embedding-dimensions: 1024
    providers:
      - name: dashscope
        api-key: ${AI_API_KEY:}
        base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        model: ${AI_CHAT_MODEL:qwen-plus}

  interview:
    question-count: 5

  knowledge:
    chunk-size: 800
    chunk-overlap: 100

  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:resumes}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: smart-interviewer

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.smartinterview: INFO
